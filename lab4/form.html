<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
        <ul class="nav__list">
            <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
            <li class="nav__item"><a href="about-me.html" class="nav__link">Обо мне</a></li>
            <li class="nav__item"><a href="about-cat.html" class="nav__link">О моем коте</a></li>
            <li class="nav__item"><a href="form.html" class="nav__link">Обратная связь</a></li>
        </ul>
    </nav>

    <main class="container">
        <section class="card">
            <h1 class="card__title card__title_main">Обратная связь</h1>
            <p class="card__subtitle">Оставьте сообщение для меня или передайте привет Саймону</p>

            <form id="feedbackForm" class="feedback-form">
                <div class="feedback-form__group">
                    <label for="userName" class="feedback-form__label">Ваше имя</label>
                    <input type="text" id="userName" name="userName" class="feedback-form__input" placeholder="Например, Иван" required>
                </div>

                <div class="feedback-form__group">
                    <label for="userEmail" class="feedback-form__label">Электронная почта</label>
                    <input type="email" id="userEmail" name="userEmail" class="feedback-form__input" placeholder="example@mail.ru" required>
                </div>

                <div class="feedback-form__group">
                    <label for="userMessage" class="feedback-form__label">Сообщение</label>
                    <textarea id="userMessage" name="userMessage" rows="4" class="feedback-form__input" placeholder="Напишите что-нибудь..." required></textarea>
                </div>

                <button type="submit" class="feedback-form__submit">Отправить данные</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
